<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Airzone central, Open Airzone Gateway and Home Assistant: no cloud, no subscription</title>
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6a4b"/>
      <stop offset="1" stop-color="#1d4a34"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fbf6a"/>
      <stop offset="1" stop-color="#3f9d4c"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e9e6"/>
      <stop offset="0.5" stop-color="#fbfbf9"/>
      <stop offset="1" stop-color="#e4e4e0"/>
    </linearGradient>
    <g id="screw">
      <circle r="9" fill="#d9dde0" stroke="#7b848b" stroke-width="1.5"/>
      <path d="M-6 0H6" stroke="#6b737a" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <!-- thermostat dial: 270 degree arc, radius 40, pathLength 100 -->
    <path id="dial" d="M-28.28 28.28 A40 40 0 1 1 28.28 28.28" pathLength="100"/>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="598" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <!-- title -->
  <text x="40" y="62" font-size="28" font-weight="700" fill="#14213d">Your Airzone zones, in Home Assistant</text>
  <text x="40" y="92" font-size="16" fill="#5b6472">A small ESP32 board takes the place of the Airzone Cloud Webserver. Everything stays local.</text>

  <!-- no cloud -->
  <g transform="translate(905 40)">
    <path d="M22 62 a20 20 0 0 1 2-40 a28 28 0 0 1 52-6 a22 22 0 0 1 30 20 a18 18 0 0 1-4 26 z" fill="#eef1f5" stroke="#9aa3ad" stroke-width="3" stroke-linejoin="round"/>
    <path d="M14 76 L106 4" stroke="#d62828" stroke-width="6" stroke-linecap="round"/>
    <text x="122" y="38" font-size="17" font-weight="700" fill="#d62828">no cloud,</text>
    <text x="122" y="60" font-size="17" font-weight="700" fill="#d62828">no subscription</text>
  </g>

  <!-- ===================== wires ===================== -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="6">
    <path d="M336 250 H400 V150 H595 V182" stroke="#d62828"/>
    <path d="M336 290 H420 V165 H545 V182" stroke="#23262b"/>
    <path d="M336 330 H420 V520 H580 V496" stroke="#16a34a"/>
    <path d="M336 370 H400 V535 H610 V496" stroke="#1d6fd8"/>
  </g>
  <text x="446" y="140" font-size="13" font-weight="700" fill="#5b6472">12 V + GND</text>
  <text x="456" y="478" font-size="13" font-weight="700" fill="#5b6472" text-anchor="middle">RS-485</text>
  <text x="456" y="495" font-size="13" font-weight="700" fill="#5b6472" text-anchor="middle">A, B</text>

  <!-- ===================== Airzone central ===================== -->
  <rect x="40" y="170" width="270" height="280" rx="14" fill="url(#pcb)" stroke="#173d2b" stroke-width="2"/>
  <g fill="#ffffff" opacity="0.10">
    <circle cx="66" cy="196" r="8"/><circle cx="284" cy="196" r="8"/>
    <circle cx="66" cy="424" r="8"/><circle cx="284" cy="424" r="8"/>
  </g>
  <rect x="80" y="214" width="100" height="58" rx="6" fill="#16382a" stroke="#0f2a1f"/>
  <rect x="80" y="288" width="58" height="38" rx="4" fill="#16382a" stroke="#0f2a1f"/>
  <rect x="154" y="288" width="58" height="38" rx="4" fill="#16382a" stroke="#0f2a1f"/>
  <text x="66" y="378" font-size="21" font-weight="700" fill="#ffffff">Airzone central</text>
  <text x="66" y="402" font-size="13.5" fill="#cfe7d9">zones, dampers, thermostats,</text>
  <text x="66" y="420" font-size="13.5" fill="#cfe7d9">IAQ sensor</text>
  <!-- screw plug on the domotic bus header -->
  <rect x="298" y="226" width="40" height="168" rx="5" fill="url(#term)" stroke="#2f7a3a" stroke-width="2"/>
  <use href="#screw" x="318" y="250"/>
  <use href="#screw" x="318" y="290"/>
  <use href="#screw" x="318" y="330"/>
  <use href="#screw" x="318" y="370"/>

  <!-- ===================== Waveshare gateway ===================== -->
  <rect x="520" y="178" width="100" height="36" rx="5" fill="url(#term)" stroke="#2f7a3a" stroke-width="2"/>
  <use href="#screw" x="545" y="196"/>
  <use href="#screw" x="595" y="196"/>
  <rect x="490" y="208" width="160" height="264" rx="14" fill="url(#case)" stroke="#bfc3c6" stroke-width="2"/>
  <rect x="500" y="466" width="130" height="36" rx="5" fill="url(#term)" stroke="#2f7a3a" stroke-width="2"/>
  <use href="#screw" x="520" y="484"/>
  <use href="#screw" x="550" y="484"/>
  <use href="#screw" x="580" y="484"/>
  <use href="#screw" x="610" y="484"/>
  <rect x="504" y="226" width="132" height="228" rx="9" fill="#15181c"/>
  <g font-size="10" fill="#d8dde2" text-anchor="middle">
    <circle cx="530" cy="262" r="6" fill="#c9a28e"/>
    <circle cx="570" cy="262" r="6" fill="#7ed957"/>
    <circle cx="610" cy="262" r="6" fill="#c0392b"/>
  </g>
  <text x="570" y="336" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">WAVESHARE</text>
  <text x="570" y="356" font-size="10.5" font-weight="700" fill="#d8dde2" text-anchor="middle">ESP32-S3-RS485-CAN</text>
  <rect x="522" y="392" width="96" height="24" rx="12" fill="#7ed957"/>
  <text x="570" y="408" font-size="11.5" font-weight="700" fill="#15181c" text-anchor="middle">open firmware</text>

  <!-- ===================== Wi-Fi link ===================== -->
  <path d="M660 340 H750" stroke="#5b6472" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
  <g transform="translate(705 300)" fill="none" stroke="#14213d" stroke-width="4" stroke-linecap="round">
    <path d="M-22 -8 a32 32 0 0 1 44 0"/>
    <path d="M-13 1 a19 19 0 0 1 26 0"/>
    <circle cx="0" cy="11" r="3.5" fill="#14213d" stroke="none"/>
  </g>
  <text x="705" y="372" font-size="13" font-weight="700" fill="#5b6472" text-anchor="middle">Wi-Fi</text>
  <text x="705" y="389" font-size="13" font-weight="700" fill="#5b6472" text-anchor="middle">MQTT</text>

  <!-- ===================== Home Assistant ===================== -->
  <rect x="760" y="140" width="400" height="384" rx="14" fill="#f2f4f7" stroke="#d5dae0" stroke-width="2"/>
  <path d="M760 184 V154 a14 14 0 0 1 14-14 H1146 a14 14 0 0 1 14 14 V184 z" fill="#03a9f4"/>
  <text x="782" y="169" font-size="17" font-weight="700" fill="#ffffff">Home Assistant</text>
  <text x="1140" y="169" font-size="13" fill="#e1f5fe" text-anchor="end">Climate</text>

  <!-- tile: heat 21.0 -->
  <g transform="translate(776 198)">
    <rect width="180" height="152" rx="12" fill="#ffffff" stroke="#e3e6ea"/>
    <g transform="translate(90 62)" fill="none" stroke-width="8" stroke-linecap="round">
      <use href="#dial" stroke="#e6e8eb"/>
      <use href="#dial" stroke="#ff8100" stroke-dasharray="40 100"/>
    </g>
    <text x="90" y="72" font-size="22" font-weight="700" fill="#14213d" text-anchor="middle">21.0°</text>
    <text x="90" y="110" font-size="11.5" fill="#5b6472" text-anchor="middle">now 20.4 °C</text>
    <text x="90" y="130" font-size="14" font-weight="700" fill="#14213d" text-anchor="middle">Living room</text>
    <text x="90" y="145" font-size="11.5" fill="#ff8100" text-anchor="middle">Heat</text>
  </g>
  <!-- tile: heat 18.0 -->
  <g transform="translate(968 198)">
    <rect width="180" height="152" rx="12" fill="#ffffff" stroke="#e3e6ea"/>
    <g transform="translate(90 62)" fill="none" stroke-width="8" stroke-linecap="round">
      <use href="#dial" stroke="#e6e8eb"/>
      <use href="#dial" stroke="#ff8100" stroke-dasharray="20 100"/>
    </g>
    <text x="90" y="72" font-size="22" font-weight="700" fill="#14213d" text-anchor="middle">18.0°</text>
    <text x="90" y="110" font-size="11.5" fill="#5b6472" text-anchor="middle">now 18.6 °C</text>
    <text x="90" y="130" font-size="14" font-weight="700" fill="#14213d" text-anchor="middle">Bedroom</text>
    <text x="90" y="145" font-size="11.5" fill="#ff8100" text-anchor="middle">Heat</text>
  </g>
  <!-- tile: heat 20.5 -->
  <g transform="translate(776 360)">
    <rect width="180" height="152" rx="12" fill="#ffffff" stroke="#e3e6ea"/>
    <g transform="translate(90 62)" fill="none" stroke-width="8" stroke-linecap="round">
      <use href="#dial" stroke="#e6e8eb"/>
      <use href="#dial" stroke="#ff8100" stroke-dasharray="36.7 100"/>
    </g>
    <text x="90" y="72" font-size="22" font-weight="700" fill="#14213d" text-anchor="middle">20.5°</text>
    <text x="90" y="110" font-size="11.5" fill="#5b6472" text-anchor="middle">now 19.8 °C</text>
    <text x="90" y="130" font-size="14" font-weight="700" fill="#14213d" text-anchor="middle">Kitchen</text>
    <text x="90" y="145" font-size="11.5" fill="#ff8100" text-anchor="middle">Heat</text>
  </g>
  <!-- tile: off -->
  <g transform="translate(968 360)">
    <rect width="180" height="152" rx="12" fill="#ffffff" stroke="#e3e6ea"/>
    <g transform="translate(90 62)" fill="none" stroke-width="8" stroke-linecap="round">
      <use href="#dial" stroke="#e6e8eb"/>
    </g>
    <text x="90" y="72" font-size="22" font-weight="700" fill="#8a929c" text-anchor="middle">Off</text>
    <text x="90" y="110" font-size="11.5" fill="#5b6472" text-anchor="middle">now 19.1 °C</text>
    <text x="90" y="130" font-size="14" font-weight="700" fill="#14213d" text-anchor="middle">Office</text>
    <text x="90" y="145" font-size="11.5" fill="#8a929c" text-anchor="middle">Off</text>
  </g>

  <!-- captions -->
  <g font-size="13.5" fill="#5b6472" text-anchor="middle">
    <text x="175" y="478">Your installation, unchanged</text>
    <text x="570" y="566">The gateway, four wires</text>
    <text x="960" y="566">Every zone as a climate entity</text>
  </g>
</svg>
