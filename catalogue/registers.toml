# Airzone register catalogue: the single source of truth.
# Zone and outlet `reg` are offsets in their block; system and iaq `reg` are absolute.
# Evidence rows refer to docs/reverse-engineering.md (tests of 2026-11-05/06).

[[param]]
id = "zone.power"
scope = "zone"
reg = 0x0000
bits = "2-2"
kind = "bool"
access = "rw"
tier = 1
confidence = "confirmed"
evidence = "2026-11-05 cloud/HA test, see docs/reverse-engineering.md"
ha = { component = "climate", role = "power" }
ui = { screen = "zones", section = "Zone", order = 10, label = "Power" }

[[param]]
id = "zone.sleep"
scope = "zone"
reg = 0x0000
bits = "6-7"
kind = "enum"
access = "rw"
tier = 1
confidence = "confirmed"
evidence = "2026-11-06 cloud test, see docs/reverse-engineering.md"
values = { 0 = "off", 1 = "30 min", 2 = "60 min", 3 = "90 min" }
ha = { component = "select", role = "sleep" }
ui = { screen = "zones", section = "Zone", order = 40, label = "Sleep timer" }

