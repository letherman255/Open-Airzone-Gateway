name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # espup asks the GitHub API for releases: unauthenticated calls hit the shared-runner rate limit
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          version: 1.97.0.0
          buildtargets: esp32s3
          default: true
          ldproxy: true
      - name: Install espflash
        run: |
          curl -fsSL -o espflash.zip https://github.com/esp-rs/espflash/releases/download/v4.0.1/espflash-x86_64-unknown-linux-gnu.zip
          unzip -o espflash.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build firmware (Waveshare, master)
        working-directory: firmware/esp
        env:
          AZ_BOARD: waveshare-esp32s3-rs485
        run: cargo build --release --features master --target-dir target
      - name: Images, partition table, site
        run: |
          set -euo pipefail
          mkdir -p stage
          espflash save-image --chip esp32s3 firmware/esp/target/xtensa-esp32s3-espidf/release/airzone-gateway stage/app.bin
          espflash partition-table firmware/esp/partitions.csv --to-binary -o stage/partition-table.bin
          bootloader=$(ls -t firmware/esp/target/xtensa-esp32s3-espidf/release/build/esp-idf-sys-*/out/build/bootloader/bootloader.bin | head -n1)
          python3 -I tools/build_site.py --tag "${{ github.ref_name }}" \
            --cargo firmware/esp/Cargo.toml --partitions firmware/esp/partitions.csv \
            --bootloader "$bootloader" --partition-table stage/partition-table.bin --app stage/app.bin \
            --page docs/flasher/index.html \
            --base-url https://letherman255.github.io/Open-Airzone-Gateway/ --out site
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$v" '/^## /{p = (index($0, "[" v "]") || index($0, " " v) ) ? 1 : 0; next} p' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then echo "Open Airzone Gateway ${GITHUB_REF_NAME}" > release-notes.md; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            site/firmware/*/*.bin
            site/SHA256SUMS
            release-notes.md

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: dist/release-notes.md
          files: |
            dist/site/firmware/*/*.bin
            dist/site/SHA256SUMS

  pages:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
