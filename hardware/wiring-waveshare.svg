<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Wiring: Airzone central to Waveshare ESP32-S3-RS485-CAN</title>
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6a4b"/>
      <stop offset="1" stop-color="#1d4a34"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fbf6a"/>
      <stop offset="1" stop-color="#3f9d4c"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e9e6"/>
      <stop offset="0.5" stop-color="#fbfbf9"/>
      <stop offset="1" stop-color="#e4e4e0"/>
    </linearGradient>
    <g id="screw">
      <circle r="11" fill="#d9dde0" stroke="#7b848b" stroke-width="1.5"/>
      <path d="M-7 0H7" stroke="#6b737a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="698" rx="18" fill="#ffffff" stroke="#e3e6ea" stroke-width="2"/>

  <!-- title -->
  <text x="40" y="58" font-size="26" font-weight="700" fill="#14213d">Wiring the gateway</text>
  <text x="40" y="86" font-size="15" fill="#5b6472">Master mode: four wires, no soldering</text>

  <!-- ===================== wires (drawn first, under the parts) ===================== -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="7">
    <!-- +12 V : plug (420,220) -> VCC (875,125) -->
    <path d="M420 220 H460 V60 H925 V118" stroke="#d62828"/>
    <!-- GND : plug (420,340) -> GND (825,125) -->
    <path d="M420 340 H500 V85 H875 V118" stroke="#23262b"/>
    <!-- B : plug (420,280) -> B- (900,585), hop over GND at x=500 -->
    <path d="M420 280 H488 A12 12 0 0 1 512 280 H580 V610 H900 V592" stroke="#16a34a"/>
    <!-- A : plug (420,400) -> A+ (940,585) -->
    <path d="M420 400 H560 V635 H940 V592" stroke="#1d6fd8"/>
  </g>
  <!-- wire labels -->
  <g font-size="14" font-weight="700">
    <text x="650" y="52" fill="#d62828">+12 V</text>
    <text x="650" y="77" fill="#23262b">GND (−)</text>
    <text x="650" y="603" fill="#16a34a">B</text>
    <text x="650" y="628" fill="#1d6fd8">A</text>
  </g>

  <!-- ===================== Airzone central ===================== -->
  <rect x="40" y="120" width="330" height="430" rx="14" fill="url(#pcb)" stroke="#173d2b" stroke-width="2"/>
  <g fill="#ffffff" opacity="0.10">
    <circle cx="70" cy="150" r="9"/><circle cx="340" cy="150" r="9"/>
    <circle cx="70" cy="520" r="9"/><circle cx="340" cy="520" r="9"/>
  </g>
  <rect x="85" y="170" width="120" height="70" rx="6" fill="#16382a" stroke="#0f2a1f"/>
  <rect x="85" y="260" width="70" height="44" rx="4" fill="#16382a" stroke="#0f2a1f"/>
  <text x="70" y="470" font-size="22" font-weight="700" fill="#ffffff">Airzone central</text>
  <text x="70" y="496" font-size="14" fill="#cfe7d9">domotic bus header,</text>
  <text x="70" y="515" font-size="14" fill="#cfe7d9">where the webserver plugs in</text>

  <!-- pin labels on the board -->
  <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="350" y="226">+12 V</text>
    <text x="350" y="286">B</text>
    <text x="350" y="346">− (GND)</text>
    <text x="350" y="406">A</text>
    <text x="350" y="466" fill="#cfe7d9" font-weight="400">shield</text>
  </g>

  <!-- MC plug -->
  <rect x="362" y="180" width="62" height="310" rx="6" fill="url(#term)" stroke="#2f7a3a" stroke-width="2"/>
  <g>
    <use href="#screw" x="400" y="220"/>
    <use href="#screw" x="400" y="280"/>
    <use href="#screw" x="400" y="340"/>
    <use href="#screw" x="400" y="400"/>
    <use href="#screw" x="400" y="460"/>
  </g>
  <!-- shield not connected -->
  <g stroke="#9aa3ad" stroke-width="3" stroke-linecap="round">
    <path d="M424 460 H440"/>
    <path d="M436 452 l12 16 M448 452 l-12 16"/>
  </g>
  <text x="454" y="465" font-size="13" fill="#7b848b">n.c.</text>

  <text x="40" y="584" font-size="14" font-weight="700" fill="#14213d">Screw plug: Phoenix Contact MC 1,5/5-ST-3,81</text>
  <text x="40" y="604" font-size="13" fill="#5b6472">Mouser 651-1803604 · 5 positions, 3.81 mm pitch</text>
  <text x="40" y="622" font-size="13" fill="#5b6472">Shield: leave unconnected (n.c.)</text>

  <!-- ===================== Waveshare module ===================== -->
  <!-- top terminal block + USB-C -->
  <rect x="850" y="100" width="100" height="44" rx="5" fill="url(#term)" stroke="#2f7a3a" stroke-width="2"/>
  <use href="#screw" x="875" y="124"/>
  <use href="#screw" x="925" y="124"/>
  <rect x="800" y="108" width="54" height="30" rx="9" fill="#cfd4d8" stroke="#8a939a" stroke-width="1.5"/>
  <rect x="812" y="118" width="30" height="10" rx="5" fill="#59626a"/>

  <!-- case -->
  <rect x="780" y="140" width="220" height="410" rx="14" fill="url(#case)" stroke="#bfc3c6" stroke-width="2"/>
  <rect x="772" y="290" width="236" height="110" rx="10" fill="none" stroke="#cfd2d4" stroke-width="2"/>

  <!-- bottom terminal block -->
  <rect x="800" y="546" width="160" height="44" rx="5" fill="url(#term)" stroke="#2f7a3a" stroke-width="2"/>
  <use href="#screw" x="820" y="568"/>
  <use href="#screw" x="860" y="568"/>
  <use href="#screw" x="900" y="568"/>
  <use href="#screw" x="940" y="568"/>

  <!-- front label -->
  <rect x="800" y="168" width="180" height="356" rx="10" fill="#15181c"/>
  <!-- top labels -->
  <rect x="812" y="182" width="40" height="22" rx="7" fill="none" stroke="#7ed957" stroke-width="2"/>
  <rect x="820" y="189" width="24" height="8" rx="4" fill="#7ed957"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="875" cy="194" r="15" fill="#7ed957"/><text x="875" y="198" fill="#15181c">GND</text>
    <circle cx="925" cy="194" r="15" fill="#7ed957"/><text x="925" y="198" fill="#15181c">VCC</text>
  </g>
  <text x="900" y="230" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DC 7–36 V</text>
  <!-- LEDs -->
  <g font-size="10" fill="#d8dde2" text-anchor="middle">
    <circle cx="830" cy="262" r="8" fill="#c9a28e"/><text x="830" y="284">CAN</text>
    <circle cx="880" cy="262" r="8" fill="#c9a28e"/><text x="880" y="284">RS485</text>
    <circle cx="930" cy="262" r="8" fill="#c0392b"/><text x="930" y="284">PWR</text>
  </g>
  <!-- name -->
  <text x="890" y="345" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">WAVESHARE</text>
  <text x="890" y="370" font-size="12.5" font-weight="700" fill="#d8dde2" text-anchor="middle">ESP32-S3-RS485-CAN</text>
  <!-- bottom labels -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="840" y="462">CAN</text>
    <text x="920" y="462">RS485</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="820" cy="495" r="15" fill="#7ed957"/><text x="820" y="499" fill="#15181c">L</text>
    <circle cx="860" cy="495" r="15" fill="#7ed957"/><text x="860" y="499" fill="#15181c">H</text>
    <circle cx="900" cy="495" r="15" fill="#7ed957"/><text x="900" y="499" fill="#15181c">B−</text>
    <circle cx="940" cy="495" r="15" fill="#7ed957"/><text x="940" y="499" fill="#15181c">A+</text>
  </g>

  <!-- ===================== notes ===================== -->
  <g font-size="14" fill="#14213d">
    <text x="1030" y="196" font-weight="700" font-size="15">Before you power up</text>
    <g transform="translate(1030 222)">
      <circle cx="6" cy="-5" r="4" fill="#d62828"/>
      <text x="18" y="0">Never USB-C and</text>
      <text x="18" y="18">the bus at the</text>
      <text x="18" y="36">same time</text>
    </g>
    <g transform="translate(1030 296)">
      <circle cx="6" cy="-5" r="4" fill="#d62828"/>
      <text x="18" y="0">12 V bus only</text>
    </g>
    <g transform="translate(1030 332)">
      <circle cx="6" cy="-5" r="4" fill="#e0a100"/>
      <text x="18" y="0">120 Ω RS-485</text>
      <text x="18" y="18">jumper: off (NC)</text>
    </g>
    <g transform="translate(1030 388)">
      <circle cx="6" cy="-5" r="4" fill="#e0a100"/>
      <text x="18" y="0">CAN L / H:</text>
      <text x="18" y="18">unused</text>
    </g>
    <g transform="translate(1030 444)">
      <circle cx="6" cy="-5" r="4" fill="#1d6fd8"/>
      <text x="18" y="0">No frames?</text>
      <text x="18" y="18">swap A and B</text>
    </g>
  </g>

  <text x="40" y="676" font-size="12.5" fill="#8a929c">Unplug the Airzone webserver before switching the gateway to master mode. Listen mode next to the webserver: see hardware/README.md.</text>
</svg>
